server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # file (e.g. /incidents, /analytics on a hard refresh) must still serve
    # index.html so the SPA's own router can take over, otherwise nginx
    # returns a 404 for anything but the root path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # cached so new deploys are picked up on refresh.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
