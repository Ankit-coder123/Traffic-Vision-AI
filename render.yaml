# Render Blueprint -- defines the TrafficVision AI stack as Render
# services. Render doesn't run docker-compose.yml directly; this file is
# Render's equivalent, with one deliberate difference: the simulator runs
# as a background thread inside trafficvision-backend (see main.py)
# rather than its own service, because Render's free plan only offers Web
# Services and Static Sites -- Background Worker services require a paid
# plan. docker-compose.yml is unaffected and still runs the simulator as
# its own container for local dev; both are valid, this just fits free
# hosting.
#
# The frontend is deployed as a Render Static Site rather than reusing
# frontend/Dockerfile's nginx container -- Render's static sites are free,
# don't spin down, and Vite's build output is just static files anyway, so
# running a whole nginx container for it on Render is unnecessary. Locally
# and in Docker Compose, frontend/Dockerfile's nginx approach is still used
# (see README's Docker Deployment section) -- this is a Render-specific
# choice, not a change to local dev.
#
# To deploy: push this repo to GitHub, then on Render:
#   New -> Blueprint -> connect this repo -> Render reads this file and
#   provisions everything below automatically.
#
# See README.md's "Cloud Deployment (Render)" section for the full
# walkthrough, including which env vars need real values filled in
# manually (marked sync: false below -- Render prompts for these in the
# dashboard rather than guessing a value).

databases:
  - name: trafficvision-db
    plan: free
    databaseName: trafficvision
    user: trafficvision

services:
  # --- Backend API ---
  - type: web
    name: trafficvision-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trafficvision-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates a real random secret -- no placeholder risk
      - key: FRONTEND_URL
        value: https://trafficvision-frontend.onrender.com  # update if your site name differs
      - key: GOOGLE_CLIENT_ID
        sync: false  # optional -- fill in on Render's dashboard if you want Google Sign-In
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false  # optional -- fill in for email alerts
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: TrafficVision AI
      # --- Simulator (runs as a background thread inside this same
      # service -- see main.py's startup event. Render's free plan has no
      # Background Worker service type, only Web Services and Static
      # Sites, so this replaces what would otherwise be a separate
      # trafficvision-simulator worker. ---
      - key: RUN_SIMULATOR
        value: "true"
      - key: SIMULATOR_ADMIN_EMAIL
        sync: false  # a real email you control -- the @trafficvision.ai placeholder domain
                     # isn't deliverable and will bounce every incident report once SMTP_* is set
      - key: SIMULATOR_ADMIN_PASSWORD
        generateValue: true

  # --- Frontend (Render Static Site -- free, no spin-down, no nginx needed) ---
  - type: web
    name: trafficvision-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trafficvision-backend.onrender.com  # update if your backend name differs
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false  # optional -- same value as GOOGLE_CLIENT_ID above if using Google Sign-In
    routes:
      # React Router client-side routing -- any path that isn't a real
      # built file must still serve index.html so the SPA's own router
      # can take over (same reasoning as frontend/nginx.conf for Docker).
      - type: rewrite
        source: /*
        destination: /index.html
